<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>러시아어 단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#151A1F;
    --paper:#EDEAE3;
    --card:#FFFFFF;
    --red:#D8352A;
    --steel:#5B6B7A;
    --line:#CFCABF;
    --green:#2E7D5B;
    --r:2px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Inter","Noto Sans KR",system-ui,sans-serif;
    font-size:16px;line-height:1.5;
    display:flex;flex-direction:column;
    min-height:100dvh;
    overflow-x:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

  /* ---------- header ---------- */
  header{
    background:var(--ink);color:#fff;
    padding:14px 16px 0;
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{
    font-family:"Oswald",sans-serif;font-weight:700;
    font-size:22px;letter-spacing:.06em;text-transform:uppercase;
  }
  .brand .sub{font-size:11px;letter-spacing:.18em;color:#8FA0AF;text-transform:uppercase}
  .stats{display:flex;align-items:flex-end;gap:14px;margin-top:10px}
  .stat{line-height:1}
  .stat b{font-family:"Oswald",sans-serif;font-size:26px;font-weight:600}
  .stat span{display:block;font-size:10px;letter-spacing:.14em;color:#8FA0AF;margin-top:4px;text-transform:uppercase}
  .stat.done b{color:var(--red)}
  .bar{height:6px;background:#2A333C;margin:12px -16px 0;position:relative;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--red);width:0;transition:width .35s ease}

  /* ---------- tabs ---------- */
  nav{display:flex;background:var(--ink);border-top:1px solid #2A333C}
  nav button{
    flex:1;padding:12px 4px;font-size:13px;font-weight:500;color:#8FA0AF;
    border-bottom:3px solid transparent;
  }
  nav button.on{color:#fff;border-bottom-color:var(--red)}
  nav button b{font-family:"Oswald",sans-serif;font-weight:600;margin-left:5px;font-size:12px}

  /* ---------- controls ---------- */
  .controls{
    background:var(--paper);border-bottom:1px solid var(--line);
    padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  }
  .chips{display:flex;gap:6px;overflow-x:auto;flex:1 1 100%;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    white-space:nowrap;padding:6px 11px;font-size:12.5px;font-weight:500;
    border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--steel)
  }
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .toggles{display:flex;gap:6px;flex-wrap:wrap}
  .tg{
    font-size:11.5px;padding:5px 10px;border:1px solid var(--line);background:#fff;
    color:var(--steel);letter-spacing:.02em
  }
  .tg.on{background:var(--red);border-color:var(--red);color:#fff}

  /* ---------- main ---------- */
  main{flex:1;display:flex;flex-direction:column;padding:18px 16px 0;max-width:640px;width:100%;margin:0 auto}

  /* ---------- card ---------- */
  .card{
    background:var(--card);border:1px solid var(--line);
    flex:1;display:flex;flex-direction:column;position:relative;
    min-height:320px;cursor:pointer;overflow:hidden;
  }
  .card .tag{
    position:absolute;top:0;left:0;display:flex;align-items:stretch;
  }
  .card .num{
    background:var(--red);color:#fff;font-family:"Oswald",sans-serif;font-weight:600;
    font-size:13px;letter-spacing:.05em;padding:6px 10px;
  }
  .card .loc{
    background:var(--ink);color:#B9C4CE;font-size:11px;letter-spacing:.08em;
    padding:6px 10px;display:flex;align-items:center;
  }
  .front{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:56px 22px 22px;text-align:center;gap:14px;
  }
  .word{
    font-family:"Oswald",sans-serif;font-weight:600;
    font-size:clamp(30px,8.5vw,50px);line-height:1.1;letter-spacing:.01em;
    word-break:keep-all;
  }
  .word.ko{font-family:"Noto Sans KR",sans-serif;font-weight:700;font-size:clamp(26px,7vw,42px)}
  .hint{font-size:12px;color:var(--steel);letter-spacing:.06em}
  .back{
    display:none;flex:1;flex-direction:column;padding:52px 22px 22px;overflow-y:auto;gap:0;
  }
  .card.open .front{display:none}
  .card.open .back{display:flex}
  .b-word{font-family:"Oswald",sans-serif;font-weight:600;font-size:30px;line-height:1.15}
  .b-mean{font-weight:700;font-size:18px;margin-top:4px;color:var(--ink)}
  .b-note{
    font-size:12.5px;color:var(--steel);margin-top:10px;padding-top:10px;
    border-top:1px solid var(--line);line-height:1.6
  }
  .ex{margin-top:16px;padding-left:12px;border-left:3px solid var(--red)}
  .ex.book{border-left-color:var(--steel);display:none}
  .ex.show{display:block}
  .ex .lbl{font-size:10px;letter-spacing:.16em;color:var(--steel);text-transform:uppercase;margin-bottom:5px}
  .ex .ru{font-size:17px;line-height:1.5}
  .ex .ko{font-size:14px;color:var(--steel);margin-top:5px;line-height:1.5}

  /* ---------- actions ---------- */
  .actions{display:flex;gap:10px;padding:14px 0 18px;position:sticky;bottom:0;background:var(--paper)}
  .actions button{
    flex:1;padding:16px 8px;font-size:15px;font-weight:700;letter-spacing:.02em;
    border:1.5px solid var(--ink);
  }
  .btn-no{background:#fff;color:var(--ink)}
  .btn-yes{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn-yes:active{background:var(--red);border-color:var(--red)}
  .keys{text-align:center;font-size:11px;color:var(--steel);padding-bottom:14px;letter-spacing:.03em}

  /* ---------- list ---------- */
  .list{padding-bottom:24px}
  .row{
    background:#fff;border:1px solid var(--line);border-bottom:none;
    padding:12px 14px;display:flex;align-items:center;gap:12px;
  }
  .row:last-child{border-bottom:1px solid var(--line)}
  .row .idx{font-family:"Oswald",sans-serif;font-size:12px;color:var(--steel);width:30px;flex:none}
  .row .txt{flex:1;min-width:0}
  .row .rw{font-family:"Oswald",sans-serif;font-size:18px;font-weight:600}
  .row .rm{font-size:13px;color:var(--steel);margin-top:1px}
  .row .re{font-size:12.5px;color:var(--steel);margin-top:5px;line-height:1.45}
  .row .re span{color:var(--ink)}
  .row button{
    flex:none;font-size:11.5px;padding:7px 10px;border:1px solid var(--line);color:var(--steel)
  }
  .row button:active{background:var(--ink);color:#fff}

  .empty{
    text-align:center;padding:70px 20px;color:var(--steel);
  }
  .empty b{display:block;font-family:"Oswald",sans-serif;font-size:20px;color:var(--ink);margin-bottom:8px;letter-spacing:.04em}
  .empty p{font-size:13.5px;line-height:1.7}

  footer{
    text-align:center;padding:16px;font-size:11px;color:var(--steel);letter-spacing:.04em
  }
  footer button{text-decoration:underline;font-size:11px;color:var(--steel)}
  .saveflag{font-size:10px;color:var(--steel);opacity:.7}

  @media (min-width:700px){
    header{padding:18px 24px 0}
    .bar{margin:14px -24px 0}
    main{padding-top:24px}
    .card{min-height:380px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  :focus-visible{outline:3px solid var(--red);outline-offset:2px}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Русский</h1>
    <div class="sub">단어장 · 198</div>
  </div>
  <div class="stats">
    <div class="stat done"><b id="sDone">0</b><span>외운 단어</span></div>
    <div class="stat"><b id="sLeft">0</b><span>남은 단어</span></div>
    <div class="stat"><b id="sPct">0%</b><span>진도</span></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
</header>

<nav>
  <button id="tabStudy" class="on" onclick="setView('study')">학습 <b id="nStudy"></b></button>
  <button id="tabDone" onclick="setView('done')">외운 단어 <b id="nDone"></b></button>
  <button id="tabAll" onclick="setView('all')">전체 <b id="nAll"></b></button>
</nav>

<div class="controls">
  <div class="chips" id="chips"></div>
  <div class="toggles">
    <button class="tg" id="tgDir" onclick="toggle('dir')">한 → 러</button>
    <button class="tg" id="tgShuffle" onclick="toggle('shuffle')">무작위</button>
    <button class="tg" id="tgBook" onclick="toggle('book')">교재 예문</button>
  </div>
</div>

<main id="main"></main>

<footer>
  <span class="saveflag" id="saveflag"></span>
  <button onclick="resetAll()">기록 전체 초기화</button>
</footer>

/* =========================================================
   저장소 — 아티팩트에서는 window.storage, 웹 배포 시 localStorage
   ========================================================= */
const KEY = "ru-vocab-v1";
const Store = {
  mode: (typeof window !== "undefined" && window.storage) ? "cloud" : "local",
  async load(){
    try{
      if(this.mode === "cloud"){
        const r = await window.storage.get(KEY);
        return r ? JSON.parse(r.value) : null;
      }
      const raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  },
  async save(data){
    try{
      if(this.mode === "cloud"){ await window.storage.set(KEY, JSON.stringify(data)); }
      else { localStorage.setItem(KEY, JSON.stringify(data)); }
      return true;
    }catch(e){ return false; }
  }
};

/* =========================================================
   상태
   ========================================================= */
let S = {
  known: {},          // {단어id: true}
  view: "study",      // study | done | all
  chapter: 0,         // 0 = 전체
  dir: false,         // false: 러→한, true: 한→러
  shuffle: false,
  book: false,
  pos: 0,
  open: false,
  order: []
};

/* =========================================================
   초기화
   ========================================================= */
(async function init(){
  const saved = await Store.load();
  if(saved){
    S.known = saved.known || {};
    S.chapter = saved.chapter ?? 0;
    S.dir = !!saved.dir;
    S.shuffle = !!saved.shuffle;
    S.book = !!saved.book;
  }
  document.getElementById("saveflag").textContent =
    Store.mode === "cloud" ? "기록이 이 대화에 저장됩니다" : "기록이 이 브라우저에 저장됩니다";
  buildChips();
  buildOrder();
  render();
})();

function persist(){
  Store.save({known:S.known, chapter:S.chapter, dir:S.dir, shuffle:S.shuffle, book:S.book});
}

/* =========================================================
   목록 계산
   ========================================================= */
function inChapter(w){ return S.chapter === 0 || w.c === S.chapter; }
function pool(){
  let list = WORDS.filter(inChapter);
  if(S.view === "study") list = list.filter(w => !S.known[w.i]);
  if(S.view === "done")  list = list.filter(w =>  S.known[w.i]);
  return list;
}
function buildOrder(){
  S.order = pool().map(w => w.i);
  if(S.shuffle){
    for(let i=S.order.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [S.order[i],S.order[j]] = [S.order[j],S.order[i]];
    }
  }
  if(S.pos >= S.order.length) S.pos = 0;
  S.open = false;
}
const byId = id => WORDS.find(w => w.i === id);

/* =========================================================
   화면 구성
   ========================================================= */
function buildChips(){
  const box = document.getElementById("chips");
  box.innerHTML = "";
  const mk = (label, val) => {
    const b = document.createElement("button");
    b.className = "chip" + (S.chapter === val ? " on" : "");
    b.textContent = label;
    b.onclick = () => { S.chapter = val; S.pos = 0; buildChips(); buildOrder(); render(); persist(); };
    box.appendChild(b);
  };
  mk("전체", 0);
  for(let c=1;c<CH.length;c++) mk(CH[c], c);
}

function setView(v){
  S.view = v; S.pos = 0;
  ["study","done","all"].forEach(x=>{
    document.getElementById("tab"+x[0].toUpperCase()+x.slice(1)).classList.toggle("on", x===v);
  });
  buildOrder(); render();
}

function toggle(what){
  if(what==="dir"){ S.dir = !S.dir; }
  if(what==="shuffle"){ S.shuffle = !S.shuffle; buildOrder(); }
  if(what==="book"){ S.book = !S.book; }
  S.open = false;
  render(); persist();
}

function mark(id, known){
  if(known) S.known[id] = true; else delete S.known[id];
  persist();
  if(S.view === "study" && known){
    S.order.splice(S.pos, 1);
    if(S.pos >= S.order.length) S.pos = 0;
  } else {
    next();
  }
  S.open = false;
  render();
}
function next(){ if(S.order.length) S.pos = (S.pos + 1) % S.order.length; }

/* =========================================================
   렌더
   ========================================================= */
function render(){
  const all = WORDS.filter(inChapter);
  const done = all.filter(w => S.known[w.i]).length;
  const left = all.length - done;
  const pct = all.length ? Math.round(done/all.length*100) : 0;
  document.getElementById("sDone").textContent = done;
  document.getElementById("sLeft").textContent = left;
  document.getElementById("sPct").textContent = pct + "%";
  document.getElementById("bar").style.width = pct + "%";
  document.getElementById("nStudy").textContent = left;
  document.getElementById("nDone").textContent = done;
  document.getElementById("nAll").textContent = all.length;

  document.getElementById("tgDir").textContent = S.dir ? "한 → 러" : "러 → 한";
  document.getElementById("tgDir").classList.toggle("on", S.dir);
  document.getElementById("tgShuffle").classList.toggle("on", S.shuffle);
  document.getElementById("tgBook").classList.toggle("on", S.book);

  const main = document.getElementById("main");
  main.innerHTML = "";

  if(S.view === "done" || S.view === "all"){ renderList(main); return; }

  if(!S.order.length){
    main.innerHTML = `<div class="empty"><b>ВСЁ ГОТОВО</b>
      <p>이 범위는 다 외웠습니다.<br>다른 챕터를 고르거나, 외운 단어 탭에서 되돌려 다시 볼 수 있습니다.</p></div>`;
    return;
  }
  renderCard(main);
}

function renderCard(main){
  const w = byId(S.order[S.pos]);
  const card = document.createElement("div");
  card.className = "card" + (S.open ? " open" : "");
  card.onclick = () => { S.open = !S.open; render(); };

  const front = S.dir
    ? `<div class="word ko">${w.m}</div>`
    : `<div class="word">${w.w}</div>`;

  const bookEx = w.b ? `
    <div class="ex book ${S.book?"show":""}">
      <div class="lbl">교재 예문</div>
      <div class="ru">${w.b}</div>
      <div class="ko">${w.bk}</div>
    </div>` : "";

  card.innerHTML = `
    <div class="tag">
      <div class="num">${String(w.i).padStart(3,"0")}</div>
      <div class="loc">${CH[w.c]} · p.${w.p}</div>
    </div>
    <div class="front">
      ${front}
      <div class="hint">탭하면 뜻과 예문이 나옵니다</div>
    </div>
    <div class="back">
      <div class="b-word">${w.w}</div>
      <div class="b-mean">${w.m}</div>
      ${w.n ? `<div class="b-note">${w.n}</div>` : ""}
      <div class="ex">
        <div class="lbl">예문</div>
        <div class="ru">${w.e}</div>
        <div class="ko">${w.k}</div>
      </div>
      ${bookEx}
    </div>`;
  main.appendChild(card);

  const act = document.createElement("div");
  act.className = "actions";
  act.innerHTML = `
    <button class="btn-no">아직이요</button>
    <button class="btn-yes">외웠어요</button>`;
  act.children[0].onclick = () => { S.open=false; next(); render(); };
  act.children[1].onclick = () => mark(w.i, true);
  main.appendChild(act);

  const keys = document.createElement("div");
  keys.className = "keys";
  keys.textContent = `${S.pos+1} / ${S.order.length}   ·   스페이스 뒤집기 · ← 아직 · → 외웠어요`;
  main.appendChild(keys);
}

function renderList(main){
  const list = pool();
  if(!list.length){
    main.innerHTML = `<div class="empty"><b>ПУСТО</b>
      <p>${S.view==="done" ? "아직 외운 단어가 없습니다.<br>학습 탭에서 시작하세요." : "이 범위에 단어가 없습니다."}</p></div>`;
    return;
  }
  const box = document.createElement("div");
  box.className = "list";
  list.forEach(w=>{
    const on = !!S.known[w.i];
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div class="idx">${String(w.i).padStart(3,"0")}</div>
      <div class="txt">
        <div class="rw">${w.w}</div>
        <div class="rm">${w.m}</div>
        <div class="re"><span>${w.e}</span><br>${w.k}</div>
      </div>
      <button>${on ? "다시 외우기" : "외웠어요"}</button>`;
    row.querySelector("button").onclick = () => {
      if(on) delete S.known[w.i]; else S.known[w.i] = true;
      persist(); render();
    };
    box.appendChild(row);
  });
  main.appendChild(box);
}

function resetAll(){
  if(!confirm("외운 단어 기록을 모두 지웁니다. 계속할까요?")) return;
  S.known = {}; S.pos = 0; persist(); buildOrder(); render();
}

/* =========================================================
   키보드
   ========================================================= */
document.addEventListener("keydown", e=>{
  if(S.view !== "study" || !S.order.length) return;
  if(e.code === "Space"){ e.preventDefault(); S.open = !S.open; render(); }
  if(e.key === "ArrowRight"){ mark(S.order[S.pos], true); }
  if(e.key === "ArrowLeft"){ S.open=false; next(); render(); }
});
</script>
</body>
