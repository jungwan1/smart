<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>러시아어 단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#151A1F; --paper:#EDEAE3; --card:#FFF;
    --red:#D8352A; --amber:#C9820A; --steel:#5B6B7A; --line:#CFCABF;
    --gold:#D9B23C; --goldpaper:#F5EBCF;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:"Inter","Noto Sans KR",system-ui,sans-serif;
       font-size:16px;line-height:1.5;display:flex;flex-direction:column;min-height:100dvh;overflow-x:hidden}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

  .quote{
    background:var(--paper);border-bottom:1px solid var(--line);
    padding:22px 20px 18px;text-align:center;cursor:pointer;position:relative;
  }
  .quote .ko{
    font-family:"Nanum Myeongjo","Noto Sans KR",serif;font-weight:800;
    font-size:clamp(23px,6.2vw,32px);line-height:1.45;color:var(--ink);
    word-break:keep-all;letter-spacing:-.01em;
  }
  .quote .ru{
    font-size:12.5px;color:var(--steel);margin-top:9px;line-height:1.45;
    font-style:italic;word-break:keep-all;
  }
  .quote .src{font-size:10.5px;color:var(--steel);opacity:.75;margin-top:7px;letter-spacing:.06em}
  .quote::after{
    content:"";position:absolute;left:50%;bottom:9px;transform:translateX(-50%);
    width:34px;height:2px;background:var(--red);opacity:.55;
  }

  header{background:var(--ink);color:#fff;padding:13px 16px 0;position:sticky;top:0;z-index:20}
  .hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .howbtn{
    flex:none;background:transparent;color:#fff;border:1.5px solid #4A5763;
    font-size:11.5px;font-weight:700;padding:8px 11px;line-height:1.3;
  }
  .howbtn:active{background:#fff;color:var(--ink);border-color:#fff}

  .modal{display:none;position:fixed;inset:0;z-index:60;background:rgba(21,26,31,.55)}
  .modal.open{display:flex;align-items:flex-end;justify-content:center}
  .sheet{
    background:var(--paper);width:100%;max-width:640px;max-height:88dvh;overflow-y:auto;
    padding:20px 18px 28px;border-top:5px solid var(--red);
  }
  .sheet .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .sheet .top h2{font-size:17px;font-weight:700;letter-spacing:0;border:none;padding:0;margin:0;font-family:inherit}
  .sheet .top button{font-size:13px;color:var(--steel);border:1px solid var(--line);background:#fff;padding:7px 12px}
  @media (min-width:700px){ .modal.open{align-items:center} .sheet{border:1px solid var(--line);border-top:5px solid var(--red)} }

  .stats{display:flex;align-items:flex-end;gap:16px}
  .stat b{font-family:"Oswald",sans-serif;font-size:25px;font-weight:600}
  .stat span{display:block;font-size:10px;letter-spacing:.12em;color:#8FA0AF;margin-top:4px}
  .stat.ok b{color:var(--red)} .stat.mid b{color:#F0A93B}
  .bar{height:6px;background:#2A333C;margin:12px -16px 0;display:flex;overflow:hidden}
  .bar i{display:block;height:100%;width:0;transition:width .35s ease}
  .bar .b1{background:var(--red)} .bar .b2{background:#F0A93B}

  nav{display:flex;background:var(--ink);border-top:1px solid #2A333C}
  nav button{flex:1;padding:12px 2px;font-size:12px;font-weight:500;color:#8FA0AF;border-bottom:3px solid transparent}
  nav button.on{color:#fff;border-bottom-color:var(--red)}
  nav button b{font-family:"Oswald",sans-serif;font-weight:600;margin-left:4px;font-size:11.5px}
  nav button.gold{background:var(--gold);color:#2B2410;font-weight:700}
  nav button.gold b{color:#2B2410}
  nav button.gold.on{background:#F0C64B;color:#1C1708;border-bottom-color:#7A5E10}
  body.goldbg{background:var(--goldpaper)}
  body.goldbg .controls,body.goldbg .subfilter button,body.goldbg main{background:transparent}
  body.goldbg .controls{background:var(--goldpaper)}

  .controls{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px}
  .chips{display:flex;gap:6px;overflow-x:auto;flex:1 1 100%;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;padding:6px 11px;font-size:12.5px;font-weight:500;border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--steel)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .toggles{display:flex;gap:6px;flex-wrap:wrap}
  .tg{font-size:11.5px;padding:5px 10px;border:1px solid var(--line);background:#fff;color:var(--steel)}
  .tg.on{background:var(--red);border-color:var(--red);color:#fff}

  main{flex:1;display:flex;flex-direction:column;padding:18px 16px 0;max-width:640px;width:100%;margin:0 auto}

  .card{background:var(--card);border:1px solid var(--line);flex:1;display:flex;flex-direction:column;
        position:relative;min-height:300px;cursor:pointer;overflow:hidden}
  .card .tag{position:absolute;top:0;left:0;right:0;display:flex}
  .card .num{background:var(--red);color:#fff;font-family:"Oswald",sans-serif;font-weight:600;font-size:13px;padding:6px 10px}
  .card .loc{background:var(--ink);color:#B9C4CE;font-size:11px;letter-spacing:.06em;padding:6px 10px;display:flex;align-items:center;flex:1;gap:7px}
  .card .loc em{font-style:normal;color:#F0A93B;font-weight:600}
  .card .cnt{background:var(--ink);color:#fff;font-family:"Oswald",sans-serif;font-size:12px;padding:6px 10px;display:flex;align-items:center;border-left:1px solid #2A333C}
  .card .cnt.hot{background:var(--red)}
  .front{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 22px 22px;text-align:center;gap:14px}
  .word{font-family:"Oswald",sans-serif;font-weight:600;font-size:clamp(30px,8.5vw,50px);line-height:1.1;word-break:keep-all}
  .word.ko{font-family:"Noto Sans KR",sans-serif;font-weight:700;font-size:clamp(26px,7vw,42px)}
  .hint{font-size:12px;color:var(--steel);letter-spacing:.06em}
  .back{display:none;flex:1;flex-direction:column;padding:52px 22px 22px;overflow-y:auto}
  .card.open .front{display:none}
  .card.open .back{display:flex}
  .b-word{font-family:"Oswald",sans-serif;font-weight:600;font-size:30px;line-height:1.15}
  .b-pos{display:inline-block;background:var(--ink);color:#fff;font-size:11px;font-weight:700;
         padding:3px 9px;border-radius:2px;margin-top:7px;letter-spacing:.02em}
  .b-mean{font-weight:700;font-size:18px;margin-top:6px}
  .b-note{font-size:12.5px;color:var(--steel);margin-top:10px;padding-top:10px;border-top:1px solid var(--line);line-height:1.6}
  .ex{margin-top:16px;padding-left:12px;border-left:3px solid var(--red)}
  .ex.book{border-left-color:var(--steel);display:none}
  .ex.show{display:block}
  .ex .lbl{font-size:10px;letter-spacing:.16em;color:var(--steel);margin-bottom:5px}
  .ex .ru{font-size:17px;line-height:1.5}
  .ex .ko{font-size:14px;color:var(--steel);margin-top:5px;line-height:1.5}

  .fam{margin-top:18px;border-top:2px solid var(--ink);padding-top:10px}
  .fam .lbl{font-size:10px;letter-spacing:.16em;color:var(--steel);margin-bottom:7px}
  .fam .lbl.ant{margin-top:14px;padding-top:11px;border-top:1px dotted var(--line)}
  .kr{display:flex;align-items:baseline;gap:9px;padding:5px 0}
  .kr.me{background:#F6F2E6;margin:0 -6px;padding:5px 6px}
  .kr .pos{flex:none;width:58px;font-size:10.5px;color:#fff;background:var(--steel);
           text-align:center;padding:3px 0;border-radius:2px;letter-spacing:-.02em}
  .kr .pos.op{background:var(--amber)}
  .kr .fw{font-family:"Oswald",sans-serif;font-size:16px;font-weight:600}
  .kr .fm{font-size:12.5px;color:var(--steel)}

  .actions{display:flex;gap:7px;padding:14px 0 0;position:sticky;bottom:0;background:var(--paper)}
  .actions button{flex:1;padding:14px 4px;font-size:13.5px;font-weight:700;border:1.5px solid var(--ink);line-height:1.25}
  .btn-no{background:#fff;color:var(--ink)}
  .btn-mid{background:#fff;color:var(--amber);border-color:var(--amber)}
  .btn-mid:active{background:var(--amber);color:#fff}
  .btn-yes{background:var(--ink);color:#fff}
  .btn-yes:active{background:var(--red);border-color:var(--red)}
  .again{display:flex;gap:10px;padding:10px 0 16px}
  .again button{flex:1;padding:11px 8px;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--steel)}
  .again button:active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .keys{text-align:center;font-size:11px;color:var(--steel);padding-bottom:14px}

  .subfilter{display:flex;gap:6px;margin-bottom:10px}
  .subfilter button{flex:1;padding:9px 4px;font-size:12.5px;border:1px solid var(--line);background:#fff;color:var(--steel)}
  .subfilter button.on{background:var(--ink);border-color:var(--ink);color:#fff}

  .list{padding-bottom:24px}
  .item{background:#fff;border:1px solid var(--line);border-bottom:none}
  .item:last-child{border-bottom:1px solid var(--line)}
  .item.mid{border-left:4px solid var(--amber)}
  .row{padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
  .row::after{content:"＋";color:var(--steel);font-size:14px;flex:none}
  .item.open .row::after{content:"－"}
  .det{display:none;padding:2px 14px 16px 46px}
  .item.open .det{display:block}
  .det .ex{margin-top:6px}
  .tinypos{font-family:"Noto Sans KR",sans-serif;font-size:10.5px;font-weight:500;
           color:#fff;background:var(--steel);padding:2px 6px;border-radius:2px;vertical-align:middle}
  .row .idx{font-family:"Oswald",sans-serif;font-size:12px;color:var(--steel);width:30px;flex:none}
  .row .txt{flex:1;min-width:0}
  .row .rw{font-family:"Oswald",sans-serif;font-size:18px;font-weight:600}
  .row .rm{font-size:13px;color:var(--steel);margin-top:2px}
  .row .meta{font-family:"Oswald",sans-serif;font-size:11px;color:var(--red);margin-top:5px;letter-spacing:.05em}
  .row .meta em{font-style:normal;color:var(--amber)}
  .row .side{flex:none;display:flex;flex-direction:column;gap:5px}
  .row .side button{font-size:11px;padding:6px 9px;border:1px solid var(--line);color:var(--steel);white-space:nowrap}
  .row .side button:active{background:var(--ink);color:#fff}

  .empty{text-align:center;padding:60px 20px;color:var(--steel)}
  .empty b{display:block;font-family:"Oswald",sans-serif;font-size:20px;color:var(--ink);margin-bottom:8px}
  .empty p{font-size:13.5px;line-height:1.7}
  .empty button{margin-top:18px;padding:12px 20px;border:1.5px solid var(--ink);color:var(--ink);font-size:13px;font-weight:700;background:#fff}

  .step{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
  .step:last-child{border-bottom:none}
  .step .no{flex:none;width:26px;height:26px;background:var(--ink);color:#fff;
            font-family:"Oswald",sans-serif;font-size:13px;display:flex;align-items:center;justify-content:center}
  .step.s2 .no{background:var(--amber)} .step.s3 .no{background:var(--red)}
  .step .h{font-weight:700;font-size:14.5px}
  .step .d{font-size:13px;color:var(--steel);margin-top:4px;line-height:1.6}
  .step .go{font-size:11.5px;color:var(--red);margin-top:6px;font-weight:600}

  footer{text-align:center;padding:16px;font-size:11px;color:var(--steel)}
  footer button{text-decoration:underline;font-size:11px;color:var(--steel)}
  .saveflag{display:block;font-size:10px;opacity:.7;margin-bottom:6px}

  @media (min-width:700px){header{padding:18px 24px 0}.bar{margin:14px -24px 0}.card{min-height:360px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  :focus-visible{outline:3px solid var(--red);outline-offset:2px}
</style>
</head>
<body>

<div class="quote" id="quote" onclick="showQuote()"></div>

<header>
  <div class="hrow">
    <div class="stats">
      <div class="stat ok"><b id="sOk">0</b><span>외웠다</span></div>
      <div class="stat mid"><b id="sMid">0</b><span>헷갈린다</span></div>
      <div class="stat"><b id="sNo">0</b><span>아직</span></div>
    </div>
    <button class="howbtn" onclick="openHow()">공부하는<br>방법!!</button>
  </div>
  <div class="bar"><i class="b1" id="bar1"></i><i class="b2" id="bar2"></i></div>
</header>

<nav>
  <button id="tabStudy" class="on" onclick="setView('study')">학습 <b id="nStudy"></b></button>
  <button id="tabDone" onclick="setView('done')">외운단어 <b id="nDone"></b></button>
  <button id="tabLeft" class="gold" onclick="setView('left')">못외운단어 <b id="nLeft"></b></button>
  <button id="tabAll" onclick="setView('all')">전체 <b id="nAll"></b></button>
</nav>

<div class="controls">
  <div class="chips" id="chips"></div>
  <div class="toggles">
    <button class="tg" id="tgDir" onclick="toggle('dir')">러 → 한</button>
    <button class="tg" id="tgSort" onclick="toggle('sort')">순서대로</button>
    <button class="tg" id="tgBook" onclick="toggle('book')">교재 예문</button>
  </div>
</div>

<main id="main"></main>

<div class="modal" id="howModal" onclick="if(event.target===this)closeHow()">
 <div class="sheet">
  <div class="top">
    <h2>공부하는 방법</h2>
    <button onclick="closeHow()">닫기</button>
  </div>

  <button class="step s1" onclick="closeHow();setView('all')">
    <div class="no">1</div>
    <div>
      <div class="h">아침에 일어나서 단어 리스트를 훑어본다</div>
      <div class="d">외울 생각 말고 눈으로 쭉 넘기기만. 오늘 뭘 볼지 머리에 넣어 두는 단계입니다.</div>
      <div class="go">→ 전체 목록 열기</div>
    </div>
  </button>

  <button class="step s2" onclick="closeHow();setView('left');setSub(1)">
    <div class="no">2</div>
    <div>
      <div class="h">헷갈린다 — 이동 중이나 짬날 때</div>
      <div class="d">지하철, 기다리는 시간, 잠깐 비는 틈. 이미 한 번 외운 것들이라 짧게 여러 번 스치는 게 제일 잘 붙습니다.</div>
      <div class="go">→ 헷갈리는 단어만 보기</div>
    </div>
  </button>

  <button class="step s3" onclick="closeHow();setView('left');setSub(2)">
    <div class="no">3</div>
    <div>
      <div class="h">아직 — 시간 내서 조용한 데서</div>
      <div class="d">처음 만나는 단어는 집중이 필요합니다. 예문까지 소리 내어 읽고, 같은 뿌리 단어도 함께 보세요.</div>
      <div class="go">→ 아직 못 외운 단어만 보기</div>
    </div>
  </button>
 </div>
</div>

<footer>
  <span class="saveflag" id="saveflag"></span>
  <span class="saveflag">v8 · 단어 198개 · 파일 2개</span>
  <button onclick="resetAll()">기록 전체 초기화</button>
</footer>

<script src="words.js?v=7"></script>
<script>
if(typeof WORDS === "undefined" || typeof FAMS === "undefined"){
  document.body.innerHTML =
    '<div style="padding:44px 24px;font-family:sans-serif;line-height:1.8">' +
    '<h2 style="font-size:18px;margin-bottom:12px">words.js를 불러오지 못했습니다</h2>' +
    '<p style="font-size:14px;color:#5B6B7A">' +
    '① R.html 과 같은 폴더에 words.js 가 있는지<br>' +
    '② 파일 이름이 words(1).js 처럼 바뀌지 않았는지<br>' +
    '③ 주소 뒤에 ?8 을 붙여 새로고침<br>' +
    '이 세 가지를 확인해 주세요.</p></div>';
  throw new Error("words.js not loaded");
}
</script>
<script>
/* =========================================================
   명언 — 열 때마다 무작위로 하나. 탭하면 다른 글로 바뀝니다.
   추가하려면 아래 배열에 {ko, ru, src} 를 넣으면 됩니다.
   ========================================================= */
const QUOTES = [
 {ko:"인내와 노력은 무엇이든 이겨낸다", ru:"Терпение и труд всё перетрут.", src:"러시아 속담"},
 {ko:"물방울이 바위를 뚫는다", ru:"Капля камень точит.", src:"러시아 속담"},
 {ko:"눈은 겁내도 손은 해낸다", ru:"Глаза боятся, а руки делают.", src:"러시아 속담"},
 {ko:"길은 걷는 사람이 이긴다", ru:"Дорогу осилит идущий.", src:"러시아 속담"},
 {ko:"반복은 배움의 어머니다", ru:"Повторение – мать учения.", src:"러시아 속담"},
 {ko:"천천히 가는 사람이 더 멀리 간다", ru:"Тише едешь – дальше будешь.", src:"러시아 속담"},
 {ko:"애쓰지 않으면 연못의 물고기도 못 잡는다", ru:"Без труда не вытащишь и рыбку из пруда.", src:"러시아 속담"},
 {ko:"시작이 어렵지 그다음은 쉽다", ru:"Лиха беда начало.", src:"러시아 속담"},
 {ko:"배우기에 늦은 때는 없다", ru:"Учиться никогда не поздно.", src:"러시아 속담"},
 {ko:"원하는 사람은 끝내 이루어낸다", ru:"Кто хочет, тот добьётся.", src:"러시아 속담"},
 {ko:"작은 새도 조금씩 둥지를 짓는다", ru:"Мало-помалу птичка гнездо вьёт.", src:"러시아 속담"},
 {ko:"항아리를 굽는 건 신이 아니다\n누구든 하면 된다", ru:"Не боги горшки обжигают.", src:"러시아 속담"},
 {ko:"누운 돌 밑으로는 물이 흐르지 않는다", ru:"Под лежачий камень вода не течёт.", src:"러시아 속담"},
 {ko:"뿌린 대로 거둔다", ru:"Что посеешь, то и пожнёшь.", src:"러시아 속담"},
 {ko:"평생 살고 평생 배워라", ru:"Век живи – век учись.", src:"러시아 속담"},
 {ko:"오늘 할 수 있는 일을\n내일로 미루지 마라", ru:"Не откладывай на завтра то, что можно сделать сегодня.", src:"러시아 속담"},
 {ko:"열 번 찍어 아니 넘어가는 나무 없다", ru:"", src:"우리 속담"},
 {ko:"천 리 길도 한 걸음부터", ru:"", src:"우리 속담"},
 {ko:"티끌 모아 태산", ru:"", src:"우리 속담"},
 {ko:"시작이 반이다", ru:"", src:"우리 속담"},
 {ko:"어제의 나보다\n한 단어만 더", ru:"", src:""},
 {ko:"오늘 한 장,\n그것이면 충분하다", ru:"", src:""}
];
let qLast = -1;
function showQuote(){
  let n;
  do { n = Math.floor(Math.random()*QUOTES.length); } while(QUOTES.length>1 && n===qLast);
  qLast = n;
  const q = QUOTES[n];
  document.getElementById("quote").innerHTML =
    `<div class="ko">${q.ko.replace(/\n/g,"<br>")}</div>` +
    (q.ru ? `<div class="ru">${q.ru}</div>` : "") +
    (q.src ? `<div class="src">${q.src}</div>` : "");
}
showQuote();

/* =========================================================
   저장 — st[단어번호] : 2 외웠다 · 1 헷갈린다 · 없음 아직
   seen[단어번호] : 뜻을 확인한 횟수
   ========================================================= */
const KEY = "ru-vocab-v1";
const Store = {
  mode: (typeof window!=="undefined" && window.storage) ? "cloud" : "local",
  async load(){
    try{
      if(this.mode==="cloud"){ const r = await window.storage.get(KEY); return r?JSON.parse(r.value):null; }
      const raw = localStorage.getItem(KEY); return raw?JSON.parse(raw):null;
    }catch(e){ return null; }
  },
  async save(d){
    try{
      if(this.mode==="cloud") await window.storage.set(KEY, JSON.stringify(d));
      else localStorage.setItem(KEY, JSON.stringify(d));
    }catch(e){}
  }
};

let S = { st:{}, seen:{}, view:"study", sub:0, chapter:0,
          dir:false, sort:0, book:false, pos:0, open:false, order:[] };
const SORTS = ["순서대로","무작위","덜 본 순"];

(async function init(){
  const v = await Store.load();
  if(v){
    S.st = v.st || {};
    if(v.known) for(const id in v.known) if(v.known[id] && !S.st[id]) S.st[id] = 2;  // 이전 기록 이어받기
    S.seen = v.seen || {};
    S.chapter = v.chapter ?? 0;
    S.dir = !!v.dir; S.book = !!v.book;
    S.sort = typeof v.sort==="number" ? v.sort : (v.shuffle?1:0);
  }
  document.getElementById("saveflag").textContent =
    Store.mode==="cloud" ? "자동 저장됩니다 (이 대화)" : "자동 저장됩니다 (이 브라우저)";
  buildChips(); buildOrder(); render();
})();

function persist(){ Store.save({st:S.st, seen:S.seen, chapter:S.chapter, dir:S.dir, sort:S.sort, book:S.book}); }

/* ---------- 상태 ---------- */
const stOf   = id => S.st[id] || 0;
const seenOf = id => S.seen[id] || 0;
const byId   = id => WORDS.find(w => w.i === id);
const POSNAME = {"명":"명사","형":"형용사","부":"부사","동":"동사",
                 "동불":"동사 불완료","동완":"동사 완료","전":"전치사","의":"의문사"};

function inChapter(w){ return S.chapter===0 || w.c===S.chapter; }
function pool(){
  let l = WORDS.filter(inChapter);
  if(S.view==="study" || S.view==="left") l = l.filter(w => stOf(w.i)!==2);
  if(S.view==="done") l = l.filter(w => stOf(w.i)===2);
  if(S.view==="left" && S.sub===1) l = l.filter(w => stOf(w.i)===1);
  if(S.view==="left" && S.sub===2) l = l.filter(w => stOf(w.i)===0);
  return l;
}
function buildOrder(){
  let l = pool();
  if(S.sort===2) l = l.slice().sort((a,b)=> seenOf(a.i)-seenOf(b.i) || a.i-b.i);
  S.order = l.map(w=>w.i);
  if(S.sort===1) for(let i=S.order.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1)); [S.order[i],S.order[j]]=[S.order[j],S.order[i]];
  }
  if(S.pos >= S.order.length) S.pos = 0;
  S.open = false;
}

/* ---------- 조작 ---------- */
function setView(v){
  S.view = v; S.pos = 0; if(v!=="left") S.sub = 0;
  tabStudy.classList.toggle("on", v==="study");
  tabDone.classList.toggle("on", v==="done");
  tabLeft.classList.toggle("on", v==="left");
  tabAll.classList.toggle("on", v==="all");
  document.body.classList.toggle("goldbg", v==="left");
  buildOrder(); render();
}
function openHow(){ document.getElementById("howModal").classList.add("open"); }
function closeHow(){ document.getElementById("howModal").classList.remove("open"); }
function setSub(n){ S.sub = n; buildOrder(); render(); }
function buildChips(){
  chips.innerHTML = "";
  const mk=(label,val)=>{
    const b=document.createElement("button");
    b.className="chip"+(S.chapter===val?" on":""); b.textContent=label;
    b.onclick=()=>{ S.chapter=val; S.pos=0; buildChips(); buildOrder(); render(); persist(); };
    chips.appendChild(b);
  };
  mk("전체",0);
  for(let c=1;c<CH.length;c++) mk(CH[c],c);
}
function toggle(what){
  if(what==="dir") S.dir=!S.dir;
  if(what==="book") S.book=!S.book;
  if(what==="sort"){ S.sort=(S.sort+1)%3; buildOrder(); }
  S.open=false; render(); persist();
}
function flip(){
  const id = S.order[S.pos];
  if(!S.open){ S.seen[id] = seenOf(id)+1; persist(); }
  S.open = !S.open; render();
}
function next(){ S.open=false; if(S.order.length) S.pos=(S.pos+1)%S.order.length; render(); }

/* level: 2 외웠다 · 1 헷갈린다 · 0 아직 */
function setLevel(id, level){
  if(level) S.st[id] = level; else delete S.st[id];
  persist();
  if(level===2 && (S.view==="study"||S.view==="left")){
    const at = S.order.indexOf(id);
    if(at>-1){ S.order.splice(at,1); if(S.pos>=S.order.length) S.pos=0; }
    S.open=false; render();
  } else next();
}
function restart(){ S.pos=0; buildOrder(); render(); }

/* ---------- 렌더 ---------- */
function render(){
  const all = WORDS.filter(inChapter);
  const ok  = all.filter(w=>stOf(w.i)===2).length;
  const mid = all.filter(w=>stOf(w.i)===1).length;
  sOk.textContent=ok; sMid.textContent=mid; sNo.textContent=all.length-ok-mid;
  bar1.style.width = all.length? (ok/all.length*100)+"%":"0";
  bar2.style.width = all.length? (mid/all.length*100)+"%":"0";
  nStudy.textContent = all.length-ok; nDone.textContent = ok;
  nLeft.textContent = all.length-ok; nAll.textContent = all.length;

  tgDir.textContent = S.dir?"한 → 러":"러 → 한"; tgDir.classList.toggle("on",S.dir);
  tgSort.textContent = SORTS[S.sort]; tgSort.classList.toggle("on",S.sort>0);
  tgBook.classList.toggle("on",S.book);

  const main = document.getElementById("main");
  main.innerHTML = "";
  if(S.view!=="study"){ renderList(main); return; }
  if(!S.order.length){
    main.innerHTML = `<div class="empty"><b>ВСЁ ГОТОВО</b>
      <p>이 범위는 다 외웠습니다.<br>외운 단어 탭에서 되돌리면 다시 볼 수 있습니다.</p>
      <button onclick="setView('done')">외운 단어 보기</button></div>`;
    return;
  }
  renderCard(main);
}

const strip = s => s.replace(/\u0301/g,"");
function famPanel(w){
  const rows = FAMS[w.f] || [];
  if(!rows.length && !w.a) return "";
  const rank = {"명":1,"형":2,"부":3,"전":4,"동":5,"동불":6,"동완":7};
  const sorted = rows.slice().sort((a,b)=>(rank[a[0]]||9)-(rank[b[0]]||9));
  const me = strip(w.w).split(" /")[0].trim();
  let html = `<div class="fam">`;
  if(sorted.length){
    html += `<div class="lbl">품사별로 보기</div>` + sorted.map(r=>{
      const isMe = strip(r[1]).split(" /")[0].trim() === me;
      return `<div class="kr${isMe?" me":""}">
                <span class="pos">${POSNAME[r[0]]||r[0]}</span>
                <span class="fw">${r[1]}</span>
                <span class="fm">${r[2]}</span>
              </div>`;
    }).join("");
  }
  if(w.a){
    html += `<div class="lbl ant">반대말</div>
             <div class="kr"><span class="pos op">반대</span><span class="fw">${w.a}</span></div>`;
  }
  return html + `</div>`;
}

function renderCard(main){
  const w = byId(S.order[S.pos]);
  const n = seenOf(w.i), lv = stOf(w.i);
  const card = document.createElement("div");
  card.className = "card" + (S.open?" open":"");
  card.onclick = flip;
  const bookEx = w.b ? `<div class="ex book ${S.book?"show":""}">
      <div class="lbl">교재 예문</div><div class="ru">${w.b}</div><div class="ko">${w.bk}</div></div>`:"";
  card.innerHTML = `
    <div class="tag">
      <div class="num">${String(w.i).padStart(3,"0")}</div>
      <div class="loc">${CH[w.c]} · p.${w.p}${lv===1?" <em>헷갈림</em>":""}</div>
      <div class="cnt ${n>=5?"hot":""}">${n}회</div>
    </div>
    <div class="front">
      ${S.dir?`<div class="word ko">${w.m}</div>`:`<div class="word">${w.w}</div>`}
      <div class="hint">탭하면 뜻과 예문이 나옵니다</div>
    </div>
    <div class="back">
      <div class="b-word">${w.w}</div>
      ${w.pos?`<div class="b-pos">${POSNAME[w.pos]||w.pos}</div>`:""}
      <div class="b-mean">${w.m}</div>
      ${w.n?`<div class="b-note">${w.n}</div>`:""}
      <div class="ex"><div class="lbl">예문</div><div class="ru">${w.e}</div><div class="ko">${w.k}</div></div>
      ${bookEx}
      ${famPanel(w)}
    </div>`;
  main.appendChild(card);

  const act = document.createElement("div");
  act.className="actions";
  act.innerHTML = `<button class="btn-no">아직<br>못 외웠다</button>
                   <button class="btn-mid">외웠지만<br>헷갈린다</button>
                   <button class="btn-yes">외웠다</button>`;
  act.children[0].onclick = ()=>setLevel(w.i,0);
  act.children[1].onclick = ()=>setLevel(w.i,1);
  act.children[2].onclick = ()=>setLevel(w.i,2);
  main.appendChild(act);

  const again = document.createElement("div");
  again.className="again";
  again.innerHTML = `<button>↻ 처음부터 다시 돌기</button>`;
  again.children[0].onclick = restart;
  main.appendChild(again);

  const keys = document.createElement("div");
  keys.className="keys";
  keys.textContent = `${S.pos+1} / ${S.order.length}  ·  스페이스 뒤집기 · 1 아직 · 2 헷갈림 · 3 외웠다`;
  main.appendChild(keys);
}

function renderList(main){
  if(S.view==="left"){
    const base = WORDS.filter(inChapter).filter(w=>stOf(w.i)!==2);
    const f = document.createElement("div");
    f.className="subfilter";
    [["전부",base.length,0],["헷갈림",base.filter(w=>stOf(w.i)===1).length,1],["아직",base.filter(w=>stOf(w.i)===0).length,2]]
      .forEach(([t,c,v])=>{
        const b=document.createElement("button");
        b.className = S.sub===v?"on":""; b.textContent = `${t} ${c}`;
        b.onclick=()=>setSub(v); f.appendChild(b);
      });
    main.appendChild(f);
  }
  let list = pool();
  if(S.sort===2) list = list.slice().sort((a,b)=> seenOf(b.i)-seenOf(a.i) || a.i-b.i);
  if(!list.length){
    const msg = S.view==="done" ? "아직 외운 단어가 없습니다.<br>학습 탭에서 시작하세요."
              : S.view==="left" ? "해당하는 단어가 없습니다." : "이 범위에 단어가 없습니다.";
    main.insertAdjacentHTML("beforeend", `<div class="empty"><b>ПУСТО</b><p>${msg}</p></div>`);
    return;
  }
  const box = document.createElement("div"); box.className="list";
  list.forEach(w=>{
    const lv = stOf(w.i), n = seenOf(w.i);
    const item = document.createElement("div");
    item.className = "item" + (lv===1?" mid":"");
    const meta = [];
    if(n) meta.push(`본 횟수 ${n}회${lv===2?" 만에 암기":""}`);
    if(lv===1) meta.push("<em>헷갈림</em>");
    item.innerHTML = `
      <div class="row">
        <div class="idx">${String(w.i).padStart(3,"0")}</div>
        <div class="txt">
          <div class="rw">${w.w} <span class="tinypos">${POSNAME[w.pos]||""}</span></div>
          <div class="rm">${w.m}</div>
          ${meta.length?`<div class="meta">${meta.join(" · ")}</div>`:""}
        </div>
        <div class="side"></div>
      </div>
      <div class="det">
        <div class="ex"><div class="lbl">예문</div><div class="ru">${w.e}</div><div class="ko">${w.k}</div></div>
        ${w.b?`<div class="ex book show"><div class="lbl">교재 예문</div><div class="ru">${w.b}</div><div class="ko">${w.bk}</div></div>`:""}
        ${w.n?`<div class="b-note">${w.n}</div>`:""}
        ${famPanel(w)}
      </div>`;
    item.querySelector(".row").onclick = e=>{
      if(e.target.closest(".side")) return;
      item.classList.toggle("open");
    };
    const side = item.querySelector(".side");
    const mk=(t,l)=>{ const b=document.createElement("button"); b.textContent=t;
      b.onclick=()=>{ if(l) S.st[w.i]=l; else delete S.st[w.i]; persist(); buildOrder(); render(); };
      side.appendChild(b); };
    if(lv===2){ mk("다시 외우기",0); }
    else { mk("외웠다",2); mk(lv===1?"헷갈림 해제":"헷갈림",lv===1?0:1); }
    box.appendChild(item);
  });
  main.appendChild(box);
}

function resetAll(){
  if(!confirm("외운 표시와 본 횟수를 모두 지웁니다. 계속할까요?")) return;
  S.st={}; S.seen={}; S.pos=0; persist(); buildOrder(); render();
}

document.addEventListener("keydown", e=>{
  if(S.view!=="study" || !S.order.length) return;
  if(e.code==="Space"){ e.preventDefault(); flip(); }
  if(e.key==="1") setLevel(S.order[S.pos],0);
  if(e.key==="2") setLevel(S.order[S.pos],1);
  if(e.key==="3") setLevel(S.order[S.pos],2);
  if(e.key==="ArrowLeft") next();
});
</script>
</body>
