<div class="wrap">
  <header>
    <div class="eyebrow">참송이버섯 · 3사 거래</div>
    <h1>정우팜 버섯 거래 구조</h1>
    <p class="lead">정우팜, 정우시스템, 성거산(김선아 이사) 세 회사가 버섯을 사고파는 관계와 등급별 단가입니다. 모든 금액은 1kg 기준입니다. 정우시스템 버섯이 성거산으로 갈 때는 반드시 정우팜을 거칩니다.</p>
  </header>

  <section>
    <h2>거래 흐름</h2>
    <div class="panel scroll">
      <svg viewBox="0 0 720 300" width="100%" role="img" aria-label="정우시스템과 정우팜은 같은 단가로 서로 사고팔고, 정우팜과 성거산도 서로 사고팔되 단가가 다르다. 정우시스템과 성거산은 직거래하지 않는다." style="min-width:520px;display:block">
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--pine)"/></marker>
          <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--amber)"/></marker>
        </defs>
        
        <g>
          <rect x="20" y="40" width="170" height="74" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
          <text x="105" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="var(--fg)">정우시스템</text>
          <text x="105" y="96" text-anchor="middle" font-size="12.5" fill="var(--muted)">기존 법인</text>
        </g>
        <g>
          <rect x="275" y="30" width="170" height="94" rx="10" fill="var(--pine-soft)" stroke="var(--pine)" stroke-width="2"/>
          <text x="360" y="68" text-anchor="middle" font-size="18" font-weight="800" fill="var(--pine)">정우팜</text>
          <text x="360" y="92" text-anchor="middle" font-size="12.5" fill="var(--muted)">모든 거래의 중간</text>
        </g>
        <g>
          <rect x="530" y="40" width="170" height="74" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
          <text x="615" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="var(--fg)">성거산</text>
          <text x="615" y="96" text-anchor="middle" font-size="12.5" fill="var(--muted)">김선아 이사</text>
        </g>
        
        <line x1="194" y1="66" x2="271" y2="66" stroke="var(--pine)" stroke-width="2" marker-end="url(#ah)"/>
        <line x1="271" y1="90" x2="194" y2="90" stroke="var(--pine)" stroke-width="2" marker-end="url(#ah)"/>
        <text x="232" y="22" text-anchor="middle" font-size="12" fill="var(--pine)" font-weight="600">양방향 · 같은 단가</text>
        
        <line x1="449" y1="66" x2="526" y2="66" stroke="var(--amber)" stroke-width="2.5" marker-end="url(#ah2)"/>
        <line x1="526" y1="90" x2="449" y2="90" stroke="var(--amber)" stroke-width="2.5" marker-end="url(#ah2)"/>
        <text x="488" y="22" text-anchor="middle" font-size="12" fill="var(--amber)" font-weight="600">양방향 · 단가 다름</text>
        
        <path d="M105,118 C105,230 615,230 615,118" fill="none" stroke="var(--loss)" stroke-width="2" stroke-dasharray="6 6"/>
        <circle cx="360" cy="201" r="15" fill="var(--loss-soft)" stroke="var(--loss)" stroke-width="2"/>
        <path d="M352,193L368,209M368,193L352,209" stroke="var(--loss)" stroke-width="2.5" stroke-linecap="round"/>
        <text x="360" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="var(--loss)">정우시스템 → 성거산 직거래 불가</text>
        <text x="360" y="266" text-anchor="middle" font-size="12" fill="var(--muted)">반드시 정우팜을 거쳐서 판매</text>
      </svg>
    </div>
    <div class="rule"><div><b>정우시스템은 성거산(김선아 이사)에 직접 팔 수 없습니다.</b> 정우시스템 버섯은 정우팜이 사서 성거산에 다시 팝니다.</div></div>
  </section>

  <section>
    <h2>등급별 단가 (원/kg)</h2>
    <div class="panel scroll">
      <table>
        <thead><tr>
          <th>등급</th>
          <th>정우팜 ⇄ 정우시스템<br>서로 살 때 (같은 값)</th>
          <th>성거산이 정우팜에서<br>살 때</th>
          <th>정우팜이 성거산에서<br>살 때</th>
          <th>정우팜 경유 차익<br>(정우시스템 → 성거산)</th>
        </tr></thead>
        <tbody id="price"></tbody>
      </table>
    </div>
    <div class="cond"><b>선별 조건</b> · 정우팜이 정우시스템 버섯을 살 때 정우시스템은 선별해서 넘깁니다. 선별하지 않고 넘기면 kg당 1,000원을 선별비로 빼고 정산합니다.</div>
    <p class="note">경유 차익은 정우시스템 버섯(선별 완료)을 정우팜이 사서 성거산에 넘길 때 정우팜에 남는 kg당 금액입니다. 미선별이면 kg당 1,000원이 더 남습니다. 박스비·운송비는 빠져 있습니다.</p>
  </section>

  <section>
    <h2>경유 거래 손익 계산</h2>
    <p class="lead" style="margin:0">정우시스템 버섯을 정우팜이 사서 성거산에 넘길 때, 등급별 kg을 넣으면 정우팜의 매입액, 판매액, 차익이 나옵니다. 입력된 값은 예시입니다.</p>
    <div class="ctrl"><span class="note" style="font-size:14px">정우시스템 버섯</span><div class="seg" role="group" aria-label="선별 여부"><button type="button" id="sortY" aria-pressed="true">선별 완료</button><button type="button" id="sortN" aria-pressed="false">미선별 (−1,000원/kg)</button></div></div>
    <div class="panel scroll">
      <table class="calc">
        <thead><tr><th>등급</th><th>수량 (kg)</th><th>정우시스템에 지급</th><th>성거산에서 받음</th><th>정우팜 차익</th></tr></thead>
        <tbody id="calc"></tbody>
        <tfoot><tr><td>합계</td><td id="tKg"></td><td id="tBuy"></td><td id="tSell"></td><td id="tNet"></td></tr></tfoot>
      </table>
    </div>
    <div class="sum">
      <div class="chip"><div class="l">정우시스템에 지급</div><div class="v" id="sBuy"></div></div>
      <div class="chip"><div class="l">성거산에서 받음</div><div class="v" id="sSell"></div></div>
      <div class="chip amber"><div class="l">정우팜 차익</div><div class="v" id="sNet"></div></div>
    </div>
  </section>

  <section>
    <h2>성거산에서 매입 계산</h2>
    <p class="lead" style="margin:0">정우팜이 성거산 버섯을 사올 때 등급별 kg을 넣으면 성거산에 지급할 금액이 나옵니다. 입력된 값은 예시입니다.</p>
    <div class="panel scroll">
      <table class="calc">
        <thead><tr><th>등급</th><th>수량 (kg)</th><th>단가 (원/kg)</th><th>성거산에 지급</th></tr></thead>
        <tbody id="buy"></tbody>
        <tfoot><tr><td>합계</td><td id="uKg"></td><td></td><td id="uAmt"></td></tr></tfoot>
      </table>
    </div>
  </section>
</div>

<script>
const GRADES=[
  {g:'A',  mutual:15000, sgs:17000, fromSgs:25000, ex:100, exB:20},
  {g:'B',  mutual:15000, sgs:17000, fromSgs:20000, ex:100, exB:20},
  {g:'C',  mutual:13000, sgs:13000, fromSgs:13000, ex:80,  exB:30},
  {g:'D',  mutual:10000, sgs:10000, fromSgs:13000, ex:50,  exB:30},
  {g:'하급',mutual:10000, sgs:7000,  fromSgs:10000, ex:60,  exB:20},
  {g:'파지',mutual:4000,  sgs:4000,  fromSgs:4000,  ex:40,  exB:10},
];
const SORT_FEE=1000; let unsorted=false;
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const signed=n=>n>0?`<span class="pos">+${n.toLocaleString('ko-KR')}</span>`:n<0?`<span class="neg">−${Math.abs(n).toLocaleString('ko-KR')}</span>`:`<span class="zer">0</span>`;
document.getElementById('price').innerHTML=GRADES.map(r=>`<tr><td><span class="g">${r.g}</span></td><td>${r.mutual.toLocaleString('ko-KR')}</td><td>${r.sgs.toLocaleString('ko-KR')}</td><td>${r.fromSgs.toLocaleString('ko-KR')}</td><td>${signed(r.sgs-r.mutual)}</td></tr>`).join('');
const body=document.getElementById('calc');
body.innerHTML=GRADES.map((r,i)=>`<tr><td><span class="g">${r.g}</span></td><td><input id="kg-${i}" inputmode="decimal" value="${r.ex}" aria-label="${r.g} 수량 kg"></td><td id="b-${i}"></td><td id="s-${i}"></td><td id="n-${i}"></td></tr>`).join('');
function calc(){
  let k=0,b=0,s=0;
  GRADES.forEach((r,i)=>{
    const v=parseFloat(document.getElementById('kg-'+i).value.replace(/,/g,''))||0;
    const buy=v*(r.mutual-(unsorted?SORT_FEE:0)), sell=v*r.sgs, net=sell-buy;
    document.getElementById('b-'+i).textContent=won(buy);
    document.getElementById('s-'+i).textContent=won(sell);
    document.getElementById('n-'+i).innerHTML=signed(Math.round(net))+(net?'원':'');
    k+=v;b+=buy;s+=sell;
  });
  const net=s-b;
  document.getElementById('tKg').textContent=k.toLocaleString('ko-KR')+' kg';
  document.getElementById('tBuy').textContent=won(b);
  document.getElementById('tSell').textContent=won(s);
  document.getElementById('tNet').innerHTML=signed(Math.round(net))+'원';
  document.getElementById('sBuy').textContent=won(b);
  document.getElementById('sSell').textContent=won(s);
  const sn=document.getElementById('sNet');sn.textContent=(net<0?'−':net>0?'+':'')+won(Math.abs(net));
  sn.style.color=net<0?'var(--loss)':'var(--amber)';
}
body.addEventListener('input',calc);
const sY=document.getElementById('sortY'),sN=document.getElementById('sortN');
function setSort(u){unsorted=u;sY.setAttribute('aria-pressed',String(!u));sN.setAttribute('aria-pressed',String(u));calc()}
sY.onclick=()=>setSort(false);sN.onclick=()=>setSort(true);calc();
const ub=document.getElementById('buy');
ub.innerHTML=GRADES.map((r,i)=>`<tr><td><span class="g">${r.g}</span></td><td><input id="bkg-${i}" inputmode="decimal" value="${r.exB}" aria-label="${r.g} 매입 수량 kg"></td><td>${r.fromSgs.toLocaleString('ko-KR')}</td><td id="ba-${i}"></td></tr>`).join('');
function calcBuy(){let k=0,a=0;GRADES.forEach((r,i)=>{const v=parseFloat(document.getElementById('bkg-'+i).value.replace(/,/g,''))||0;const amt=v*r.fromSgs;document.getElementById('ba-'+i).textContent=won(amt);k+=v;a+=amt});
 document.getElementById('uKg').textContent=k.toLocaleString('ko-KR')+' kg';document.getElementById('uAmt').textContent=won(a)}
ub.addEventListener('input',calcBuy);calcBuy();

<script>
const KEY='jw-smartfarm-settlement-v1';
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/[^\d.-]/g,''));return isFinite(n)?n:0};
const fmt=v=>{if(v===''||v==null)return'';const t=String(v).replace(/[^\d.-]/g,'');if(t===''||t==='-')return t;const[a,b]=t.split('.');return(a.startsWith('-')?'-':'')+a.replace('-','').replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,',')+(b!==undefined?'.'+b:'')};
const qtyOf=it=>it.qty===''||it.qty==null?1:num(it.qty);
document.addEventListener('input',e=>{const t=e.target;if(!t.classList||!t.classList.contains('num'))return;const p=t.selectionStart,before=t.value.slice(0,p).replace(/,/g,'').length;t.value=fmt(t.value);let i=0,c=0;while(i<t.value.length&&c<before){if(t.value[i]!=',')c++;i++}try{t.setSelectionRange(i,i)}catch(x){}},true);
function itemAmt(it){return Math.round(num(it.price)*qtyOf(it))}
function calc(c){const exp=(c.items||[]).reduce((s,i)=>s+itemAmt(i),0);const income=Math.round(num(c.income));const net=income-exp;
 const park=Math.round(net*0.33),lee=Math.round(net*0.33),ops=net-park-lee;return{income,exp,net,park,lee,ops}}
const SEED_VER=2;
function seed(){return[{id:'gimpo',name:'김포건',date:'2026-10-15',client:'김포',income:70000000,memo:'부가세 미계산. 순이익은 총 계약금액 − 지출 총액(현금+자재 대체)으로 계산.',
 items:[{name:'이룸 대금(컨테이너 공사대금)',price:35000000,qty:1,note:'현금 24,000,000 + 판넬 자재 11,000,000(정우시스템 자재 대체)'},{name:'배지 1회',price:3300,qty:1200,note:''},{name:'수도공사',price:1500000,qty:1,note:''}],
 receipts:[{stage:'계약금',amount:20000000,to:'정우시스템',status:'입금완료'},{stage:'중도금',amount:30000000,to:'정우팜',status:'입금완료'},{stage:'잔금',amount:20000000,to:'정우팜',status:'예정'}],
 advances:[{who:'박세원',amount:2000000,from:'계약금 (정우시스템)'},{who:'박세원',amount:7000000,from:'중도금 (정우팜)'}],
 offsets:[{party:'정우시스템',amount:11000000,desc:'현금 대신 판넬 자재로 이룸 대금 일부 대체'}],
 receivables:[{party:'정우시스템',amount:7000000,note:'보유 18,000,000 − 자재 대체 11,000,000 = 7,000,000 미정산'}]}]}

let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!Array.isArray(db)){db=seed();save()}
if(+(localStorage.getItem(KEY+'-ver')||1)<SEED_VER){const g=seed()[0],i=db.findIndex(x=>x.id=='gimpo');if(i>=0)db[i]=Object.assign({},db[i],g);save()}
localStorage.setItem(KEY+'-ver',SEED_VER);
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
const sorted=()=>[...db].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
const app=document.getElementById('app');
function go(v,id){location.hash=v+(id?'/'+id:'')}
function route(){const[v,id]=location.hash.slice(1).split('/');document.querySelectorAll('nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==(v||'dash')));
 document.getElementById('ledgerFab').classList.toggle('on',v=='ledger');
 if(v=='trade')trade();else if(v=='ledger')ledger();else if(v=='opex')opex(id);else if(v=='all'){location.replace('#dash');return}else if(v=='edit')edit(id);else if(v=='view')view(id);else dash();window.scrollTo(0,0)}
const sum=(a,f)=>(a||[]).reduce((s,x)=>s+num(x[f]),0);
function flow(c){const r=calc(c),rc=c.receipts||[],done=rc.filter(x=>x.status!='예정');
 const parkAdv=sum((c.advances||[]).filter(a=>a.who=='박세원'),'amount');
 const parties=[...new Set(rc.map(x=>x.to))].map(p=>{const got=sum(rc.filter(x=>x.to==p&&x.status!='예정'),'amount'),due=sum(rc.filter(x=>x.to==p&&x.status=='예정'),'amount');
  const adv=sum((c.advances||[]).filter(a=>(a.from||'').includes(p)),'amount'),off=sum((c.offsets||[]).filter(o=>o.party==p),'amount'),rec=sum((c.receivables||[]).filter(o=>o.party==p),'amount');
  return{p,got,due,adv,held:got-adv,off,rec}});
 return{received:sum(done,'amount'),pending:sum(rc.filter(x=>x.status=='예정'),'amount'),receivable:sum(c.receivables,'amount'),offset:sum(c.offsets,'amount'),parkAdv,parkLeft:r.park-parkAdv,parties}}
function flowHTML(c){const r=calc(c),f=flow(c);if(!(c.receipts||[]).length&&!(c.advances||[]).length)return'';
 return`<h5>입금 내역</h5><table><tr><th>단계</th><th>받은 곳</th><th>상태</th><th class="n">금액</th></tr>${c.receipts.map(x=>`<tr><td>${esc(x.stage)}</td><td>${esc(x.to)}</td><td>${x.status=='예정'?'<span style="color:#b36b00">예정</span>':'입금완료'}</td><td class="n">${won(x.amount)}</td></tr>`).join('')}
 <tr class="tot"><td colspan=3>입금완료 / 입금 예정</td><td class="n">${won(f.received)} / ${won(f.pending)}</td></tr></table>
 ${(c.advances||[]).length?`<h5>선지급 내역</h5><table><tr><th>받은 사람</th><th>출처 입금</th><th class="n">금액</th></tr>${c.advances.map(a=>`<tr><td>${esc(a.who)}</td><td>${esc(a.from)}</td><td class="n">${won(a.amount)}</td></tr>`).join('')}</table>`:''}
 ${(c.offsets||[]).length||(c.receivables||[]).length?`<h5>미수 / 상계</h5><table>${(c.offsets||[]).map(o=>`<tr><td>상계·대체</td><td>${esc(o.party)} — ${esc(o.desc)}</td><td class="n">${won(o.amount)}</td></tr>`).join('')}${(c.receivables||[]).map(o=>`<tr><td style="color:#b33">미수금</td><td>${esc(o.party)} — ${esc(o.note)}</td><td class="n" style="color:#b33">${won(o.amount)}</td></tr>`).join('')}</table>`:''}
 <h5>자금 흐름 요약</h5><table><tr><th>받은 곳</th><th class="n">입금완료</th><th class="n">선지급</th><th class="n">보유</th><th class="n">자재대체·상계</th><th class="n">미수금</th><th class="n">입금 예정</th></tr>
 ${f.parties.map(x=>`<tr><td>${esc(x.p)}</td><td class="n">${won(x.got)}</td><td class="n">${won(x.adv)}</td><td class="n">${won(x.held)}</td><td class="n">${won(x.off)}</td><td class="n">${won(x.rec)}</td><td class="n">${won(x.due)}</td></tr>`).join('')}</table>
 <table style="margin-top:6px">${c.items.filter(i=>i.note).map(i=>`<tr><td>${esc(i.name)} 지급 구성</td><td class="n">${esc(i.note)}</td></tr>`).join('')}
 <tr><td>박세원 수당 (33%)</td><td class="n">${won(r.park)}</td></tr><tr><td>박세원 선지급 합계</td><td class="n">${won(f.parkAdv)}</td></tr>
 <tr class="tot"><td>박세원 잔여 지급액</td><td class="n">${won(f.parkLeft)}</td></tr></table>`}
function detHTML(c){const r=calc(c);return`<div class="det"><h5>수입</h5><table><tr><td>총 계약금액 (입금 합계 기준)</td><td class="n"><b>${won(r.income)}</b></td></tr></table>
<h5>지출 항목</h5><table><tr><th>항목명</th><th class="n">단가 × 수량</th><th class="n">금액</th></tr>${c.items.map(i=>`<tr><td>${esc(i.name)}${i.note?`<div class="muted">${esc(i.note)}</div>`:''}</td><td class="n">${won(num(i.price))} × ${qtyOf(i).toLocaleString()}</td><td class="n">${won(itemAmt(i))}</td></tr>`).join('')}
<tr class="tot"><td colspan=2>지출 합계</td><td class="n">${won(r.exp)}</td></tr><tr class="tot"><td colspan=2>순이익 (입금 − 지출)</td><td class="n">${won(r.net)}</td></tr></table>
<h5>순이익 배분</h5><table><tr><td>박세원 수당 33%</td><td>입금 직후 지급</td><td class="n">${won(r.park)}</td></tr><tr><td>이승윤 수당 33%</td><td>적립 (엑시트 시 전액 지급)</td><td class="n">${won(r.lee)}</td></tr><tr><td>운영비 34%</td><td>정우팜 귀속</td><td class="n">${won(r.ops)}</td></tr></table>${flowHTML(c)}${c.memo?`<p class="muted">메모: ${esc(c.memo)}</p>`:''}</div>`}
function tog(id,b){const e=document.getElementById('d-'+id);const o=e.hidden;e.hidden=!o;b.textContent=o?'▲':'▼'}
function all(){app.innerHTML=`<h3>계약 상세 (${db.length}건)</h3>`+sorted().map(c=>`<div class="box ccard"><div class="row" style="justify-content:space-between"><b>${esc(c.name)} <span class="muted">${esc(c.date)} · ${esc(c.client)}</span></b><span class="noprint"><button class="sub btn-s" onclick="go('view','${c.id}')">정산서</button> <button class="sub btn-s" onclick="go('edit','${c.id}')">수정</button></span></div>${detHTML(c)}</div>`).join('')+`<button class="sub noprint" onclick="print()">전체 인쇄</button>`}
function dash(){let t={income:0,net:0,park:0,lee:0,ops:0},q={receivable:0,pending:0,parkLeft:0};sorted().forEach(c=>{const r=calc(c),f=flow(c);for(k in t)t[k]+=r[k];for(k in q)q[k]+=f[k]});
 app.innerHTML=`<div class="cards"><div class="card hl"><div class="l">총 매출액 (계약금액 합계)</div><div class="v">${won(t.income)}</div></div>
 <div class="card"><div class="l">총 계약 수</div><div class="v">${db.length}건</div></div><div class="card"><div class="l">이승윤 누적 적립금 (엑시트 시 전액 지급)</div><div class="v">${won(t.lee)}</div></div>
 <div class="card"><div class="l">총 순이익</div><div class="v">${won(t.net)}</div></div><div class="card"><div class="l">박세원 누적 수당</div><div class="v">${won(t.park)}</div></div>
 <div class="card"><div class="l">운영비 누적 (정우팜 귀속)</div><div class="v">${won(t.ops)}</div></div><div class="card"><div class="l">박세원 잔여 지급액</div><div class="v">${won(q.parkLeft)}</div></div><div class="card"><div class="l">미수금 합계</div><div class="v" style="color:#b33">${won(q.receivable)}</div></div><div class="card"><div class="l">입금 예정 합계</div><div class="v" style="color:#b36b00">${won(q.pending)}</div></div></div>
 <div class="box"><b>계약 건 목록</b>
 <table><tr><th>계약일</th><th>건명</th><th class="n hide-m">입금</th><th class="n hide-m">지출</th><th class="n">순이익</th><th class="n">이승윤 적립</th><th></th></tr>
 ${sorted().map(c=>{const r=calc(c);return`<tr><td><button class="tg btn-s" onclick="tog('${c.id}',this)">▼</button> ${esc(c.date)}</td><td>${esc(c.name)}</td><td class="n hide-m">${won(r.income)}</td><td class="n hide-m">${won(r.exp)}</td><td class="n">${won(r.net)}</td><td class="n">${won(r.lee)}</td><td><button class="btn-s" onclick="go('view','${c.id}')">상세보기</button></td></tr><tr id="d-${c.id}" hidden><td colspan=7>${detHTML(c)}</td></tr>`}).join('')||'<tr><td colspan=7 class="muted">계약 건이 없어요.</td></tr>'}</table></div>`}
function ledger(){let cum=0;app.innerHTML=`<div class="box"><h3>이승윤 수당 적립 장부</h3><p class="muted">순이익의 33%를 적립하며, 정우팜 엑시트 시 적립금 전액을 지급합니다.</p>
 <table><tr><th>계약일</th><th>건명</th><th class="n">순이익</th><th class="n">적립액(33%)</th><th class="n">누적 적립액</th></tr>
 ${sorted().map(c=>{const r=calc(c);cum+=r.lee;return`<tr class="click" onclick="go('view','${c.id}')"><td>${esc(c.date)}</td><td>${esc(c.name)}</td><td class="n">${won(r.net)}</td><td class="n">${won(r.lee)}</td><td class="n"><b>${won(cum)}</b></td></tr>`}).join('')}
 <tr class="tot"><td colspan=4>누적 적립금 합계</td><td class="n">${won(cum)}</td></tr></table>
 <div class="row noprint" style="margin-top:12px"><button class="sub" onclick="print()">인쇄</button></div></div>`}
function trade(){app.innerHTML='<iframe class="tradeframe" id="tf" title="버섯 거래 구조"></iframe>';
 const f=document.getElementById('tf');f.onload=()=>{const fit=()=>{try{f.style.height=f.contentDocument.documentElement.scrollHeight+'px'}catch(e){}};fit();
  try{new ResizeObserver(fit).observe(f.contentDocument.body)}catch(e){}};
 f.srcdoc=document.getElementById('tradeSrc').textContent.replace(/<\\\/script>/g,'<'+'/script>')}
function view(id){const c=db.find(x=>x.id==id);if(!c)return go('dash');const r=calc(c);
 app.innerHTML=`<div class="box doc"><h2>정 산 서</h2><table><tr><th style="width:25%">건명</th><td>${esc(c.name)}</td><th style="width:20%">계약일</th><td>${esc(c.date)}</td></tr>
 <tr><th>고객/현장</th><td colspan=3>${esc(c.client)}</td></tr></table>
 <h4>1. 수입</h4><table><tr class="tot"><td>총 입금액</td><td class="n">${won(r.income)}</td></tr></table>
 <h4>2. 지출</h4><table><tr><th>항목</th><th class="n">단가</th><th class="n">수량</th><th class="n">금액</th></tr>
 ${c.items.map(i=>`<tr><td>${esc(i.name)}${i.note?`<div class="muted">${esc(i.note)}</div>`:''}</td><td class="n">${won(num(i.price))}</td><td class="n">${qtyOf(i).toLocaleString()}</td><td class="n">${won(itemAmt(i))}</td></tr>`).join('')}
 <tr class="tot"><td colspan=3>지출 합계</td><td class="n">${won(r.exp)}</td></tr></table>
 <h4>3. 순이익</h4><table><tr class="tot"><td>순이익 (입금 − 지출)</td><td class="n">${won(r.net)}</td></tr></table>
 <h4>4. 순이익 배분</h4><table><tr><th>구분</th><th>비율</th><th>지급 조건</th><th class="n">금액</th></tr>
 <tr><td>박세원 수당</td><td>33%</td><td>입금 직후 지급</td><td class="n">${won(r.park)}</td></tr>
 <tr><td>이승윤 수당</td><td>33%</td><td>적립 (엑시트 시 전액 지급)</td><td class="n">${won(r.lee)}</td></tr>
 <tr><td>운영비</td><td>34%</td><td>정우팜 귀속</td><td class="n">${won(r.ops)}</td></tr>
 <tr class="tot"><td colspan=3>합계</td><td class="n">${won(r.park+r.lee+r.ops)}</td></tr></table>
 <h4>5. 자금 흐름</h4><div class="det" style="border:0;padding:0;background:none">${flowHTML(c)||'<p class=muted>입금·선지급 내역 없음</p>'}</div>
 ${c.memo?`<p><b>메모:</b> ${esc(c.memo).replace(/\n/g,'<br>')}</p>`:''}
 <div class="row noprint" style="margin-top:14px"><button onclick="print()">인쇄 / PDF</button><button class="sub" onclick="go('edit','${c.id}')">수정</button>
 <button class="del" onclick="if(confirm('이 계약 건을 삭제할까요?')){db=db.filter(x=>x.id!='${c.id}');save();go('dash')}">삭제</button><button class="sub" onclick="go('dash')">목록</button></div></div>`}
const LS={receipts:['입금 내역',[['stage','단계(계약금/중도금/잔금)'],['amount','금액',1],['to','받은 곳'],['status','상태(입금완료/예정)']],{stage:'',amount:'',to:'정우팜',status:'입금완료'}],
 advances:['선지급 내역',[['who','받은 사람'],['amount','금액',1],['from','출처 입금']],{who:'박세원',amount:'',from:''}],
 offsets:['상계·자재 대체',[['party','상대'],['amount','금액',1],['desc','내용']],{party:'',amount:'',desc:''}],
 receivables:['미수금',[['party','상대'],['amount','금액',1],['note','메모']],{party:'',amount:'',note:''}]};
function lists(c){const el=document.getElementById('lists');const draw=()=>{el.innerHTML=Object.entries(LS).map(([k,[t,fs]])=>`<label>${t}</label><table class="exp">${(c[k]||[]).map((x,i)=>`<tr>${fs.map(([f,ph,n])=>`<td><input ${n?'class=num inputmode=numeric':''} placeholder="${ph}" data-l=${k} data-i=${i} data-f=${f} value="${esc(n?fmt(x[f]):x[f])}"></td>`).join('')}<td><button class="del" data-l=${k} data-x=${i}>✕</button></td></tr>`).join('')}</table><button class="sub btn-s" data-add=${k}>+ ${t} 추가</button>`).join('')};
 el.oninput=e=>{const d=e.target.dataset;if(d.f)c[d.l][d.i][d.f]=e.target.value};
 el.onclick=e=>{const d=e.target.dataset;if(d.add){(c[d.add]=c[d.add]||[]).push({...LS[d.add][2]});draw()}else if(d.x!=null){c[d.l].splice(+d.x,1);draw()}};draw()}
function edit(id){const c=id?JSON.parse(JSON.stringify(db.find(x=>x.id==id)||{})):{name:'',date:new Date().toISOString().slice(0,10),client:'',income:'',memo:'',items:[{name:'',price:'',qty:1}]};
 app.innerHTML=`<div class="box"><h3>${id?'계약 수정':'새 계약 등록'}</h3><div class="grid2">
 <div><label>건명</label><input id="f-name" value="${esc(c.name)}"></div><div><label>계약일</label><input type="date" id="f-date" value="${esc(c.date)}"></div>
 <div><label>고객/현장</label><input id="f-client" value="${esc(c.client)}"></div><div><label>총 입금액(원)</label><input class="num" inputmode="numeric" id="f-income" value="${fmt(c.income)}"></div></div>
 <label>지출 항목 (단일 금액은 수량 1)</label><table class="exp"><tr><th>항목명</th><th>단가</th><th style="width:80px">수량</th><th class="n">금액</th><th></th></tr><tbody id="rows"></tbody></table>
 <button class="sub" id="add" style="margin-top:8px">+ 항목 추가</button>
 <div id="lists"></div>
 <label>메모</label><textarea id="f-memo" rows=2>${esc(c.memo)}</textarea>
 <div class="box" id="prev" style="background:#f7faf6;margin-top:12px"></div>
